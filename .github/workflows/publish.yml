name: Publicar Manual de MikroTik

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto (com TinyTeX)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # Pacotes LaTeX exigidos pelas figuras TikZ (pdflatex -> dvisvgm).
      # O tlmgr pode não estar no PATH logo após o setup; localizamos antes.
      - name: Instalar pacotes LaTeX das figuras
        run: |
          # No runner Linux o tlmgr do TinyTeX é um SYMLINK; por isso NÃO usar
          # "-type f" (excluiria o link). command -v também falha se o bin não
          # entrou no PATH. Achamos o link e pegamos o diretório bin.
          TLMGR=$(command -v tlmgr || find "$HOME" -name tlmgr 2>/dev/null | head -n1)
          BIN=$(dirname "$TLMGR")
          echo "tlmgr em: $TLMGR (bin: $BIN)"
          export PATH="$BIN:$PATH"
          # CRÍTICO: persistir o bin do TinyTeX no PATH dos próximos passos,
          # senão o render falha com "pdflatex/dvisvgm not found" — a extensão
          # TikZ chama pdflatex/dvisvgm PELO NOME.
          echo "$BIN" >> "$GITHUB_PATH"
          tlmgr install standalone pgf pgfplots dvisvgm xcolor amsmath amsfonts

      # SEM ISTO o mermaid (mapa de pré-requisitos do index.qmd) trava o render
      # do PDF no runner Ubuntu por falta de Chromium headless. A ferramenta
      # correta é chrome-headless-shell (não "chromium").
      - name: Instalar chrome-headless-shell (mermaid no PDF)
        run: quarto install chrome-headless-shell

      # ATENÇÃO: quarto-actions/publish@v2 ABORTA se a branch gh-pages não
      # existir. Criação única (ver README.md):
      #   git push origin $(git commit-tree $(git hash-object -t tree /dev/null) -m 'init gh-pages'):refs/heads/gh-pages
      - name: Render e publish (gh-pages)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
